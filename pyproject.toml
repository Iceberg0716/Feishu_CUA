[project]
name = "lark-cua-test-agent"
version = "0.1.0"
description = "CUA test agent for Feishu/Lark desktop (architecture B)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "loguru>=0.7",
  "rich>=13.7",
  "jinja2>=3.1",
  "requests>=2.31",
  "pyautogui>=0.9.54",
  "pywinauto>=0.6.8",
  "pyperclip>=1.8",
  "pillow>=10.3",
  "opencv-python>=4.9",
  "paddleocr>=2.7",
  "paddlepaddle>=2.5",
]

[project.scripts]
lark-cua-test-agent = "runtime.cli:main"

