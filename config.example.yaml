app:
  feishu_window_title_keywords:
    - 飞书
    - Feishu
    - Lark

runtime:
  screenshot_dir: artifacts/screenshots
  run_dir: artifacts/runs
  default_timeout_seconds: 30
  retry_times: 2
  side_effect_retry_times: 0

vision:
  # Master switch: when false, no OCR tools/providers should be initialized or called.
  ocr_enabled: true

ocr:
  enabled: true
  provider: paddleocr
  language: ch

vlm:
  enabled: false
  provider: openai_compatible
  model: ${VLM_MODEL}
  api_key: ${DASHSCOPE_API_KEY}
  base_url: ${VLM_BASE_URL}

feishu:
  mcp_enabled: false
  openapi_enabled: false
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}
  tenant_access_token: ${FEISHU_TENANT_ACCESS_TOKEN}

planner:
  mode: rule
  llm_enabled: false
  llm_api_key: ${PLANNER_LLM_API_KEY}

docs:
  home_entry_keyword: 云文档
  new_doc_hotkey: [ctrl, n]

im:
  # Click inside the Feishu window to focus the message input box before typing.
  # Ratios are relative to the focused Feishu window rect: (left, top) -> (right, bottom).
  message_input_x_ratio: 0.65
  message_input_y_ratio: 0.92
  # If your IM is configured as "Ctrl+Enter to send", set: [ctrl, enter]
  send_keys: [enter]
  # Ctrl+K search timings.
  after_ctrl_k_wait_seconds: 0.5
  after_ctrl_a_wait_seconds: 0.2
  after_paste_chat_name_wait_seconds: 1.0
  search_results_wait_seconds: 1.0
  after_open_chat_wait_seconds: 1.0
  # Guard: don't click inside the Ctrl+K search input area.
  # Smaller makes it easier to click the first result; larger is safer but may reject valid candidates.
  search_box_region_max_y_ratio: 0.12
  # Chat opening strategy: locate candidate on search results and click it (OCR first, VLM fallback).
  open_chat_strategy: "ocr_vlm_click"
  search_chat_max_retries: 2
  ocr_candidate_min_confidence: 0.5
  ocr_candidate_min_score: 0.6
  use_enter_to_open_chat: false
  use_down_enter_to_open_chat: false
  # Keep the IM flow minimal (match manual ops). Turn these on only if focus issues happen.
  close_search_overlay_after_open: false
  click_message_input_before_typing: false
